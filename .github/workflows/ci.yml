name: CI

on:
  push:
    branches: [main]
  pull_request:

# Permisos mínimos por defecto; amplía por job solo si hace falta
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Acciones de terceros siempre por SHA completo (el comentario indica la versión)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Comprobar el sitio estático
        run: python3 .github/scripts/check_site.py
